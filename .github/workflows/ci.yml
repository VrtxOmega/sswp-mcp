name: SSWP and ecosystem contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: sswp
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: VrtxOmega/omega-brain-mcp
          ref: 7f2a41b9bc268eaea2947f0eb1db67b3a7e2e3aa
          path: omega-brain
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: VrtxOmega/omega-stenographer-mcp
          ref: bc911633bc8af2a29ef19073c491de6059d003da
          path: omega-stenographer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/Scripts/python -m pip install -r omega-brain/requirements.txt
      - run: npm install -g pnpm@11.19.0
      - run: pnpm --dir sswp install --frozen-lockfile
      - run: pnpm --dir sswp check
      - name: Verify the committed source and complete artifact receipt before rebuilding
        run: node sswp/scripts/verify-build-receipt.cjs
      - run: pnpm --dir sswp build
      - name: Verify the rebuilt receipt
        run: node sswp/scripts/verify-build-receipt.cjs
      - name: Reject drift in any shipped bundle
        run: git -C sswp diff --exit-code -- dist/sswp.cjs dist/sswp-cli.cjs dist/witness-test.cjs dist/gates-test.cjs dist/integrity-test.cjs dist/registry-test.cjs dist/source-test.cjs
      - run: pnpm --dir sswp test
      - name: Cross-system replay and protocol tests
        run: |
          $env:OMEGA_SUITE_ROOT = $PWD.Path
          .venv/Scripts/python omega-brain/integration-tests/test_runtime.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv/Scripts/python omega-brain/integration-tests/test_mcp_flow.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
